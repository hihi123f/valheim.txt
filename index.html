<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>텍스트 발헤임 (음식/가방/저장/전투 모션 에디션)</title>
  <style>
    * { touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; box-sizing: border-box; }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1a2f1c; font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif; }
    #game-canvas { width: 100%; height: 100%; display: block; }
    
    /* 좌측 상단 HUD */
    #hud { position: absolute; top: 12px; left: 12px; color: #fff; display: flex; flex-direction: column; gap: 4px; pointer-events: none; z-index: 20; font-size: 11px; text-shadow: 1px 1px 3px rgba(0,0,0,0.9); }
    .bar-bg { width: 150px; height: 12px; background: rgba(0,0,0,0.7); border: 1px solid #444; border-radius: 3px; overflow: hidden; position: relative; }
    .bar-hp { height: 100%; background: #e74c3c; width: 100%; transition: width 0.15s; }
    .bar-sta { height: 100%; background: #f1c40f; width: 100%; }
    .bar-text { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: bold; }

    /* 활성화된 음식 버프 슬롯 */
    #food-slots { display: flex; gap: 4px; margin-top: 4px; }
    .food-slot { width: 46px; height: 26px; background: rgba(0,0,0,0.6); border: 1px solid #666; border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 8px; color: #bbb; }
    .food-slot.active { border-color: #2ecc71; color: #fff; }

    /* 우측 상단 UI */
    #clock-ui { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.8); border: 2px solid #555; padding: 6px 14px; border-radius: 8px; color: #fff; font-weight: bold; font-size: 13px; text-align: center; z-index: 30; pointer-events: none; }
    .top-btns { position: absolute; top: 58px; right: 12px; display: flex; gap: 6px; z-index: 30; }
    .small-btn { background: rgba(20,25,30,0.8); color: #fff; border: 1px solid #666; border-radius: 4px; padding: 5px 8px; font-size: 10px; cursor: pointer; }

    #raid-alert { position: absolute; top: 80px; left: 50%; transform: translateX(-50%); color: #e74c3c; font-weight: bold; font-size: 26px; text-shadow: 0 0 20px #e74c3c; z-index: 40; opacity: 0; pointer-events: none; text-align: center; transition: opacity 0.5s; width: 100%; }
    #biome-text { position: absolute; top: 120px; left: 50%; transform: translate(-50%, 0); font-weight: bold; font-size: 24px; text-shadow: 0 4px 15px rgba(0,0,0,1); z-index: 35; transition: opacity 1s ease-in-out; pointer-events: none; opacity: 0; text-align: center; width: 100%; }

    #boss-hud { position: absolute; top: 70px; left: 50%; transform: translateX(-50%); display: none; flex-direction: column; align-items: center; color: #ff4757; font-weight: bold; font-size: 12px; z-index: 20; width: 85%; max-width: 400px; }
    .boss-bar-bg { width: 100%; height: 14px; background: rgba(0,0,0,0.8); border: 2px solid #ff4757; border-radius: 4px; margin-top: 4px; overflow: hidden; }
    #boss-hp { height: 100%; background: linear-gradient(90deg, #c0392b, #ff4757); width: 100%; }

    /* 무기 퀵슬롯 UI */
    #hotbar { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; z-index: 30; }
    .slot { width: 44px; height: 44px; background: rgba(20,30,40,0.8); border: 2px solid #555; border-radius: 6px; color: #aaa; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-size: 10px; cursor: pointer; transition: 0.1s; pointer-events: auto; }
    .slot-key { color: #f1c40f; font-weight: bold; font-size: 11px; margin-bottom: 2px; pointer-events: none; }
    .slot.active { border-color: #f1c40f; background: rgba(50,60,70,0.9); color: #fff; transform: scale(1.1); box-shadow: 0 0 10px rgba(241,196,15,0.5); }
    .slot.locked { opacity: 0.3; pointer-events: none; filter: grayscale(100%); }

    /* 조작계 */
    #touch-area-left { position: absolute; top: 0; left: 0; width: 50%; height: 100%; z-index: 24; }
    #joystick-base { position: absolute; width: 100px; height: 100px; background: rgba(255, 255, 255, 0.15); border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 50%; transform: translate(-50%, -50%); display: none; pointer-events: none; z-index: 25; }
    #joystick-stick { position: absolute; top: 50%; left: 50%; width: 44px; height: 44px; margin-top: -22px; margin-left: -22px; background: rgba(241, 196, 15, 0.5); border: 2px solid rgba(241, 196, 15, 0.9); border-radius: 50%; pointer-events: none; }
    
    .btn-action { position: absolute; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; pointer-events: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.5); cursor: pointer; z-index: 35;}
    #btn-attack { bottom: 85px; right: 30px; width: 72px; height: 72px; background: rgba(231, 76, 60, 0.8); border: 2px solid #e74c3c; }
    #btn-parry { bottom: 165px; right: 45px; width: 56px; height: 56px; background: rgba(52, 152, 219, 0.8); border: 2px solid #3498db; }
    #btn-interact { bottom: 105px; right: 115px; width: 48px; height: 48px; background: rgba(241, 196, 15, 0.8); border: 2px solid #f1c40f; }
    #btn-inv { bottom: 165px; right: 115px; width: 48px; height: 48px; background: rgba(39, 174, 96, 0.8); border: 2px solid #27ae60; }
    #btn-build { bottom: 225px; right: 115px; width: 48px; height: 48px; background: rgba(142, 68, 173, 0.8); border: 2px solid #8e44ad; }
    #btn-part { bottom: 225px; right: 45px; width: 48px; height: 48px; background: rgba(155, 89, 182, 0.8); border: 2px solid #9b59b6; display: none; }

    #flash-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: white; opacity: 0; pointer-events: none; transition: opacity 0.05s ease-out; z-index: 45; }
    
    .modal-screen { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(15, 20, 25, 0.95); padding: 20px; text-align: center; color: #fff; display: none; border-radius: 8px; z-index: 50; width: 85%; max-width: 420px; border: 2px solid #555; box-shadow: 0 10px 40px rgba(0,0,0,0.8); pointer-events: auto; }
    #gameover-screen { border-color: #e74c3c; }
    #victory-screen { border-color: #f1c40f; }

    /* 인벤토리 창 스타일 */
    .inv-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 15px 0; text-align: left; }
    .inv-item { background: #2c3e50; border: 1px solid #34495e; padding: 8px 10px; border-radius: 4px; font-size: 11px; display: flex; justify-content: space-between; align-items: center; }
    .use-btn { background: #27ae60; color: white; border: none; padding: 4px 8px; border-radius: 3px; cursor: pointer; font-size: 10px; }

    .craft-item { background: #2c3e50; border: 1px solid #34495e; padding: 8px; margin-bottom: 6px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; text-align: left; font-size: 11px; }
    .craft-cost { color: #f1c40f; font-size: 9px; margin-top: 2px; }
    .craft-btn { background: #27ae60; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .craft-btn:disabled { background: #7f8c8d; cursor: not-allowed; }
  </style>
</head>
<body>
  <div id="flash-overlay"></div>

  <!-- 우측 상단 UI -->
  <div id="clock-ui">
    <div id="day-text" style="color: #f1c40f;">Day 1</div>
    <div id="time-text">☀️ 08:00</div>
  </div>
  <div class="top-btns">
    <button class="small-btn" onclick="saveGame(true)">💾 저장</button>
    <button class="small-btn" onclick="resetSave()">🔄 초기화</button>
    <button class="small-btn" onclick="toggleFullScreen()">전체화면</button>
  </div>

  <div id="raid-alert">⚠️ 숲이 분노하고 있습니다... ⚠️</div>
  <div id="biome-text">🌲 검은 숲</div>

  <!-- 좌측 HUD -->
  <div id="hud">
    <div class="bar-bg"><div id="hp-bar" class="bar-hp"></div><div class="bar-text" id="hp-text">25 / 25</div></div>
    <div class="bar-bg"><div id="sta-bar" class="bar-sta"></div><div class="bar-text" id="sta-text">50 / 50</div></div>
    
    <!-- 발헤임식 3종 음식 버프 슬롯 -->
    <div id="food-slots">
      <div class="food-slot" id="food-1"><span>슬롯 1</span><span id="food-1-time">--</span></div>
      <div class="food-slot" id="food-2"><span>슬롯 2</span><span id="food-2-time">--</span></div>
      <div class="food-slot" id="food-3"><span>슬롯 3</span><span id="food-3-time">--</span></div>
    </div>
    <div style="color: #d1b8e0; margin-top: 4px;" id="build-status-text">건축(B): 꺼짐 | 가방(I) | 상호작용(E)</div>
  </div>

  <div id="boss-hud"><div>⚡ [ 거 대 한 사 슴 왕 : 에 이 크 쉬 르 ] ⚡</div><div class="boss-bar-bg"><div id="boss-hp"></div></div></div>

  <!-- 퀵슬롯 UI -->
  <div id="hotbar">
    <div class="slot active" id="slot-barehand" onclick="setWeapon('barehand')"><span class="slot-key">1</span>맨손</div>
    <div class="slot locked" id="slot-axe" onclick="setWeapon('axe')"><span class="slot-key">2</span>돌도끼</div>
    <div class="slot locked" id="slot-bow" onclick="setWeapon('bow')"><span class="slot-key">3</span>활</div>
    <div class="slot locked" id="slot-pickaxe" onclick="setWeapon('pickaxe')"><span class="slot-key">4</span>곡괭이</div>
    <div class="slot locked" id="slot-sword" onclick="setWeapon('sword')"><span class="slot-key">5</span>청동검</div>
  </div>

  <!-- 조작 영역 -->
  <div id="touch-area-left"></div>
  <div id="joystick-base"><div id="joystick-stick"></div></div>

  <div class="btn-action" id="btn-attack">공격</div>
  <div class="btn-action" id="btn-parry">방어</div>
  <div class="btn-action" id="btn-interact">E키</div>
  <div class="btn-action" id="btn-inv">가방</div>
  <div class="btn-action" id="btn-build">건축</div>
  <div class="btn-action" id="btn-part">부품</div>

  <!-- 가방 (인벤토리) UI -->
  <div id="inv-screen" class="modal-screen">
    <h3 style="color: #2ecc71; margin: 0 0 10px 0;">🎒 가방 (인벤토리)</h3>
    <div class="inv-grid" id="inv-list"></div>
    <button onclick="closeInventory()" style="padding: 6px 18px; background: #555; color:#fff; border:none; border-radius:4px; cursor:pointer;">닫기</button>
  </div>

  <!-- 작업대 제작 UI -->
  <div id="crafting-screen" class="modal-screen">
    <h3 style="color: #3498db; margin: 0 0 10px 0;">🛠️ 작업대 (제작/강화)</h3>
    <div id="craft-list"></div>
    <button onclick="closeCrafting()" style="padding: 6px 18px; background: #555; color:#fff; border:none; border-radius:4px; cursor:pointer;">닫기</button>
  </div>
  
  <div id="gameover-screen" class="modal-screen"><h2 style="color: #e74c3c; margin: 0 0 10px 0;">💀 사 망 했 습 니 다 💀</h2><button onclick="location.reload()" style="padding: 8px 20px; margin-top: 10px; background: #e74c3c; color:#fff; border:none; border-radius:4px; cursor:pointer;">다시 도전</button></div>
  <div id="victory-screen" class="modal-screen"><h2 style="color: #f1c40f; margin: 0 0 10px 0;">⚔️ 발 할 라 입 성 ! ⚔️</h2><button onclick="location.reload()" style="padding: 8px 20px; margin-top: 10px; background: #f1c40f; border:none; border-radius:4px; cursor:pointer;">다시 플레이</button></div>

  <canvas id="game-canvas"></canvas>

  <script>
    // --- 1. 오디오 신시사이저 ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const actx = new AudioContext();
    const sfx = {
      initialized: false,
      init: function() { if(!this.initialized) { if(actx.state==='suspended') actx.resume(); this.initialized=true; } },
      playTone: function(freq, type, duration, vol=0.1, slideFreq=null) {
        if(!this.initialized) return;
        const osc = actx.createOscillator(); const gain = actx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, actx.currentTime);
        if(slideFreq) osc.frequency.exponentialRampToValueAtTime(slideFreq, actx.currentTime + duration);
        gain.gain.setValueAtTime(vol, actx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + duration);
        osc.connect(gain); gain.connect(actx.destination);
        osc.start(); osc.stop(actx.currentTime + duration);
      },
      playNoise: function(duration, vol=0.1) {
        if(!this.initialized) return;
        const bSize = actx.sampleRate * duration; const buffer = actx.createBuffer(1, bSize, actx.sampleRate);
        const data = buffer.getChannelData(0); for (let i=0; i<bSize; i++) data[i] = Math.random()*2-1;
        const noise = actx.createBufferSource(); noise.buffer = buffer;
        const gain = actx.createGain(); gain.gain.setValueAtTime(vol, actx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + duration);
        const filter = actx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 1000;
        noise.connect(filter); filter.connect(gain); gain.connect(actx.destination);
        noise.start();
      },
      swing: () => sfx.playNoise(0.12, 0.2),
      chopWood: () => sfx.playTone(180, 'square', 0.12, 0.25, 90),
      mineRock: () => sfx.playTone(850, 'triangle', 0.1, 0.3, 1400),
      hitEnemy: () => sfx.playTone(140, 'sawtooth', 0.15, 0.3, 40),
      enemyWindup: () => sfx.playTone(100, 'sawtooth', 0.3, 0.2, 250),
      parry: () => sfx.playTone(1200, 'sine', 0.2, 0.5, 600),
      eat: () => { sfx.playTone(300, 'sine', 0.1, 0.3, 500); setTimeout(()=>sfx.playTone(500, 'sine', 0.2, 0.3, 700), 100); },
      alert: () => sfx.playTone(110, 'sawtooth', 1.5, 0.4, 70)
    };

    // --- 2. 기본 엔진 설정 ---
    const canvas = document.getElementById('game-canvas'); const ctx = canvas.getContext('2d');
    const lightCanvas = document.createElement('canvas'); const lightCtx = lightCanvas.getContext('2d');
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; lightCanvas.width = window.innerWidth; lightCanvas.height = window.innerHeight; }
    window.addEventListener('resize', resize); window.addEventListener('orientationchange', () => setTimeout(resize, 200)); resize();
    function toggleFullScreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{}); else document.exitFullscreen(); }

    const WORLD_SIZE = 4000; const ALTAR_POS = { x: 2000, y: 2000 };
    const buildParts = [
      { id: 'floor', text: '[ ▤ 바닥 ]', cost: 2, collide: false, color: '#8e705b' },
      { id: 'wall', text: '[ | 벽 | ]', cost: 2, collide: true, color: '#a4b0be' },
      { id: 'spike', text: '[ ⚠️ 뾰족한 목책 ]', cost: 4, collide: true, color: '#e67e22' }, 
      { id: 'door', text: '[ 🚪 문 ]', cost: 3, collide: 'enemyOnly', color: '#d35400' },
      { id: 'workbench', text: '[ 🛠️ 작업대 ]', cost: 10, collide: true, color: '#3498db' },
      { id: 'fire', text: '[ 🔥 모닥불 ]', cost: 5, collide: false, color: '#e74c3c' }
    ];

    // 기본 체력/스태미나는 발헤임처럼 음식 없이 낮게 시작
    const state = {
      gameSeconds: 150, currentDay: 1, isNight: false, isRaid: false, raidTriggered: false, biomeLerp: 0, 
      player: { 
        x: 2000, y: 2150, hp: 25, baseMaxHp: 25, maxHp: 25, 
        sta: 50, baseMaxSta: 50, maxSta: 50, 
        speed: 1.2, weapon: 'barehand', isGuarding: false, parryWindow: 0, 
        chargeTimer: 0, maxCharge: 45, isCharging: false, facingAngle: 0, isNearFire: false 
      },
      // 3종 활성화된 음식 버프 목록 [{ id, name, hpBuff, staBuff, hpRegen, duration }]
      activeFoods: [],
      joystick: { active: false, id: null, startX: 0, startY: 0, dx: 0, dy: 0 },
      keys: {}, mouse: { x: 0, y: 0, worldX: 0, worldY: 0 },
      // 가방 인벤토리 데이터 (수량 관리)
      inventory: { 
        wood: 0, stone: 0, copper: 0, coin: 0, trophy: 0,
        meat: 0, mushroom: 0, berry: 0 // 음식 아이템들
      },
      upgrades: { axe: false, bow: false, pickaxe: false, sword: false, armor: false }, 
      buildMode: false, buildIdx: 1, structures: [],
      swingAnim: 0, axeAnim: 0, pickAnim: 0, punchAnim: 0, arrows: [], particles: [], letterPickups: [], lightnings: [], clouds: [],
      altar: { x: ALTAR_POS.x, y: ALTAR_POS.y, activated: false }, boss: null,
      enemies: [], resources: [], consumables: [], decorations: [], pois: [],
      isUIOpen: false, currentBiome: 'meadow', biomeTextTimeout: null
    };

    // --- 3. 로컬 저장 (Save / Load) ---
    const SAVE_KEY = 'valheim_text_save_v1';
    function saveGame(showAlert = false) {
      const saveData = {
        inventory: state.inventory,
        upgrades: state.upgrades,
        gameSeconds: state.gameSeconds,
        currentDay: state.currentDay,
        playerPos: { x: state.player.x, y: state.player.y },
        structures: state.structures.map(s => ({ partId: s.part.id, x: s.x, y: s.y, hp: s.hp })),
        activeFoods: state.activeFoods
      };
      localStorage.setItem(SAVE_KEY, JSON.stringify(saveData));
      if (showAlert) addTextParticle('[💾 게임 저장 완료!]', state.player.x, state.player.y - 30, '#2ecc71');
    }

    function loadGame() {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return false;
      try {
        const data = JSON.parse(raw);
        state.inventory = Object.assign(state.inventory, data.inventory);
        state.upgrades = Object.assign(state.upgrades, data.upgrades);
        state.gameSeconds = data.gameSeconds || 150;
        state.currentDay = data.currentDay || 1;
        if (data.playerPos) { state.player.x = data.playerPos.x; state.player.y = data.playerPos.y; }
        if (data.structures) {
          state.structures = data.structures.map(s => {
            const part = buildParts.find(p => p.id === s.partId) || buildParts[0];
            return { part, x: s.x, y: s.y, hp: s.hp, maxHp: 20, shake: 0 };
          });
        }
        state.activeFoods = data.activeFoods || [];
        // 해금된 무기 핫바 UI 갱신
        if (state.upgrades.axe) document.getElementById('slot-axe').classList.remove('locked');
        if (state.upgrades.bow) document.getElementById('slot-bow').classList.remove('locked');
        if (state.upgrades.pickaxe) document.getElementById('slot-pickaxe').classList.remove('locked');
        if (state.upgrades.sword) document.getElementById('slot-sword').classList.remove('locked');
        return true;
      } catch (e) { console.error('Save load failed', e); return false; }
    }

    function resetSave() {
      if (confirm('모든 진행 상황을 초기화하고 처음부터 시작하시겠습니까?')) {
        localStorage.removeItem(SAVE_KEY);
        location.reload();
      }
    }
    // 30초마다 자동 저장
    setInterval(() => saveGame(false), 30000);

    // --- 4. 맵 및 생태계 생성 ---
    function initWorld() {
      for(let i=0; i<1800; i++) state.decorations.push({ text: Math.random() > 0.9 ? '✿' : '.', x: Math.random() * WORLD_SIZE, y: Math.random() * WORLD_SIZE, color: Math.random() > 0.9 ? '#f1c40f' : 'rgba(46, 213, 115, 0.3)' });
      for(let i=0; i<60; i++) state.clouds.push({ x: Math.random() * WORLD_SIZE, y: Math.random() * WORLD_SIZE, r: 250 + Math.random() * 300, vx: 0.15 + Math.random() * 0.3, vy: 0.05 + Math.random() * 0.15, opacity: 0.02 + Math.random() * 0.04 });

      for(let i=0; i<25; i++) {
        let fx = Math.random() * WORLD_SIZE; let fy = Math.random() * WORLD_SIZE;
        let numTrees = 8 + Math.random() * 7;
        for(let j=0; j<numTrees; j++) {
          let rx = fx + (Math.random() - 0.5) * 400; let ry = fy + (Math.random() - 0.5) * 400;
          if (rx < 0 || ry < 0 || rx > WORLD_SIZE || ry > WORLD_SIZE || Math.hypot(rx - ALTAR_POS.x, ry - ALTAR_POS.y) < 150) continue;
          if(Math.hypot(rx - ALTAR_POS.x, ry - ALTAR_POS.y) > 1000 && Math.random() > 0.5) state.resources.push({ text: '[🌲 검은 소나무]', type: 'wood', letters: ['ㄴ','ㅏ','ㅁ','ㅜ'], x: rx, y: ry, hp: 5, fontSize: '22px' });
          else state.resources.push({ text: '[나무]', type: 'wood', letters: ['ㄴ','ㅏ','ㅁ','ㅜ'], x: rx, y: ry, hp: 3, fontSize: '18px' });
        }
      }

      for(let i=0; i<15; i++) {
        let rx = Math.random() * WORLD_SIZE; let ry = Math.random() * WORLD_SIZE;
        let isCopper = Math.hypot(rx - ALTAR_POS.x, ry - ALTAR_POS.y) > 1200;
        for(let j=0; j<6; j++) {
          let cx = rx + (Math.random() - 0.5) * 200; let cy = ry + (Math.random() - 0.5) * 200;
          if (cx < 0 || cy < 0 || cx > WORLD_SIZE || cy > WORLD_SIZE || Math.hypot(cx - ALTAR_POS.x, cy - ALTAR_POS.y) < 150) continue;
          if(isCopper && Math.random() > 0.6) state.resources.push({ text: '[🔷 구리 광맥]', type: 'copper', letters: ['ㄱ','ㅜ','ㄹ','ㅣ'], x: cx, y: cy, hp: 8, fontSize: '20px' });
          else state.resources.push({ text: '[🪨 바위]', type: 'stone', letters: ['ㅂ','ㅏ','ㅇ','ㅢ'], x: cx, y: cy, hp: 5, fontSize: '18px' });
        }
      }

      for(let i=0; i<80; i++) state.consumables.push({ text: '[🪨 잔돌]', type: 'small_stone', x: Math.random() * WORLD_SIZE, y: Math.random() * WORLD_SIZE });
      for(let i=0; i<10; i++) {
        let rx = Math.random() * WORLD_SIZE; let ry = Math.random() * WORLD_SIZE;
        if (Math.hypot(rx - ALTAR_POS.x, ry - ALTAR_POS.y) < 500) continue;
        state.pois.push({ text: '[🏚️ 무너진 폐가]', x: rx, y: ry });
        state.resources.push({ text: '[📦 낡은 상자]', type: 'chest', letters: ['ㅋ','ㅗ','ㅇ','ㅣ','ㄴ'], x: rx + 20, y: ry + 20, hp: 2, fontSize: '16px' });
      }

      // 모션 기반 공격 AI 데이터(windupTimer, isAttacking 등)를 가진 몬스터 스폰
      for(let i=0; i<40; i++) { 
        let rx = Math.random() * WORLD_SIZE; let ry = Math.random() * WORLD_SIZE; 
        state.enemies.push({ text: '[🐗 멧돼지]', type: 'boar', letters: ['ㄱ','ㅗ','ㄱ','ㅣ'], x: rx, y: ry, hp: 25, maxHp: 25, shake: 0, drop: 'meat', roamTimer: 0, vx: 0, vy: 0, windupTimer: 0, attackCooldown: 0 }); 
      }
      for(let i=0; i<30; i++) { 
        let rx, ry; do { rx = Math.random() * WORLD_SIZE; ry = Math.random() * WORLD_SIZE; } while(Math.hypot(rx - ALTAR_POS.x, ry - ALTAR_POS.y) < 1000); 
        state.enemies.push({ text: '[👺 고블린]', type: 'goblin', letters: ['ㄱ','ㅗ','ㅂ','ㅡ','ㄹ','ㄹ','ㅣ','ㄴ'], x: rx, y: ry, hp: 45, maxHp: 45, shake: 0, drop: 'mushroom', roamTimer: 0, vx: 0, vy: 0, windupTimer: 0, attackCooldown: 0 }); 
      }
      for(let i=0; i<120; i++) { 
        let rx = Math.random() * WORLD_SIZE; let ry = Math.random() * WORLD_SIZE; 
        state.consumables.push({ text: Math.random() > 0.5 ? '[🍓 산딸기]' : '[🍄 노란버섯]', type: Math.random() > 0.5 ? 'berry' : 'mushroom', x: rx, y: ry }); 
      }
    }
    if (!loadGame()) initWorld();

    // --- 5. 발헤임 음식 시스템 (Food Buffs) ---
    const FOOD_DATA = {
      meat: { id: 'meat', name: '익힌 고기', hpBuff: 35, staBuff: 10, hpRegen: 0.15, maxDuration: 180, icon: '🥩' },
      mushroom: { id: 'mushroom', name: '노란 버섯', hpBuff: 10, staBuff: 35, hpRegen: 0.05, maxDuration: 180, icon: '🍄' },
      berry: { id: 'berry', name: '산딸기', hpBuff: 20, staBuff: 20, hpRegen: 0.08, maxDuration: 150, icon: '🍓' }
    };

    function eatFood(foodId) {
      if (state.inventory[foodId] <= 0) return;
      // 이미 동일한 음식을 섭취 중인지 확인
      const existing = state.activeFoods.find(f => f.id === foodId);
      if (existing) { addTextParticle('[이미 섭취 중인 음식!]', state.player.x, state.player.y - 20, '#e74c3c'); return; }
      if (state.activeFoods.length >= 3) { addTextParticle('[음식은 최대 3개까지!]', state.player.x, state.player.y - 20, '#e74c3c'); return; }

      state.inventory[foodId]--;
      const data = FOOD_DATA[foodId];
      state.activeFoods.push({ id: data.id, name: data.name, hpBuff: data.hpBuff, staBuff: data.staBuff, hpRegen: data.hpRegen, duration: data.maxDuration, maxDuration: data.maxDuration, icon: data.icon });
      sfx.eat();
      addTextParticle(`[${data.name} 섭취!]`, state.player.x, state.player.y - 25, '#2ecc71');
      recalculateStats();
      renderInventory();
    }

    function recalculateStats() {
      const p = state.player;
      let totalHpBuff = 0; let totalStaBuff = 0;
      state.activeFoods.forEach(f => {
        // 시간이 지날수록 버프 효과가 서서히 감소 (발헤임 원작 반영)
        const ratio = Math.max(0.3, f.duration / f.maxDuration);
        totalHpBuff += f.hpBuff * ratio;
        totalStaBuff += f.staBuff * ratio;
      });
      // 갑옷 버프
      if (state.upgrades.armor) totalHpBuff += 100;

      p.maxHp = Math.floor(p.baseMaxHp + totalHpBuff);
      p.maxSta = Math.floor(p.baseMaxSta + totalStaBuff);
      p.hp = Math.min(p.hp, p.maxHp);
    }

    // --- 6. 인벤토리 및 가방 UI ---
    function openInventory() { state.isUIOpen = true; document.getElementById('inv-screen').style.display = 'block'; renderInventory(); }
    function closeInventory() { state.isUIOpen = false; document.getElementById('inv-screen').style.display = 'none'; }
    function renderInventory() {
      const list = document.getElementById('inv-list'); list.innerHTML = '';
      const items = [
        { id: 'meat', name: '🥩 고기 (체력 특화)', count: state.inventory.meat, isFood: true },
        { id: 'mushroom', name: '🍄 노란버섯 (스태미나)', count: state.inventory.mushroom, isFood: true },
        { id: 'berry', name: '🍓 산딸기 (균형)', count: state.inventory.berry, isFood: true },
        { id: 'wood', name: '🪵 목재', count: state.inventory.wood },
        { id: 'stone', name: '🪨 석재', count: state.inventory.stone },
        { id: 'copper', name: '🔷 구리 광석', count: state.inventory.copper },
        { id: 'coin', name: '🪙 코인', count: state.inventory.coin },
        { id: 'trophy', name: '🦌 사슴 트로피', count: state.inventory.trophy }
      ];
      items.forEach(item => {
        list.innerHTML += `
          <div class="inv-item">
            <span>${item.name} <b>x${item.count}</b></span>
            ${item.isFood ? `<button class="use-btn" ${item.count > 0 ? '' : 'disabled'} onclick="eatFood('${item.id}')">먹기</button>` : ''}
          </div>
        `;
      });
    }

    // --- 7. 제작 시스템 (Crafting) ---
    const recipes = [
      { id: 'axe', name: '[단단한 돌도끼]', req: { wood: 5, stone: 2 }, desc: '나무 벌목 속도 증가', check: () => !state.upgrades.axe },
      { id: 'bow', name: '[조잡한 활]', req: { wood: 10 }, desc: '원거리 공격 가능', check: () => !state.upgrades.bow },
      { id: 'pickaxe', name: '[사슴뿔 곡괭이]', req: { wood: 10, trophy: 3 }, desc: '바위/구리 채광 가능', check: () => !state.upgrades.pickaxe },
      { id: 'sword', name: '[청동검]', req: { wood: 5, copper: 5 }, desc: '전투 피해량 증가', check: () => !state.upgrades.sword },
      { id: 'armor', name: '[청동 갑옷]', req: { copper: 8, trophy: 2 }, desc: '최대 체력 +100 증가', check: () => !state.upgrades.armor }
    ];

    function openCrafting() { state.isUIOpen = true; document.getElementById('crafting-screen').style.display = 'block'; renderCraftList(); }
    function closeCrafting() { state.isUIOpen = false; document.getElementById('crafting-screen').style.display = 'none'; }
    function renderCraftList() {
      const list = document.getElementById('craft-list'); list.innerHTML = '';
      recipes.forEach(r => {
        if(!r.check()) return; 
        const canCraft = (r.req.wood||0) <= state.inventory.wood && (r.req.stone||0) <= state.inventory.stone && (r.req.trophy||0) <= state.inventory.trophy && (r.req.copper||0) <= state.inventory.copper;
        let reqStr = [];
        if(r.req.wood) reqStr.push(`목재 ${r.req.wood}`); if(r.req.stone) reqStr.push(`석재 ${r.req.stone}`); 
        if(r.req.trophy) reqStr.push(`트로피 ${r.req.trophy}`); if(r.req.copper) reqStr.push(`구리 ${r.req.copper}`);
        list.innerHTML += `<div class="craft-item"><div class="craft-info"><strong>${r.name}</strong><br><span style="color:#aaa;">${r.desc}</span><br><div class="craft-cost">필요: ${reqStr.join(', ')}</div></div><button class="craft-btn" ${canCraft ? '' : 'disabled'} onclick="craftItem('${r.id}')">제작</button></div>`;
      });
      if(list.innerHTML === '') list.innerHTML = '<div style="color:#888; font-size:12px;">모든 장비를 마스터했습니다!</div>';
    }
    window.craftItem = function(id) {
      const r = recipes.find(x => x.id === id);
      if(r.req.wood) state.inventory.wood -= r.req.wood; if(r.req.stone) state.inventory.stone -= r.req.stone; 
      if(r.req.trophy) state.inventory.trophy -= r.req.trophy; if(r.req.copper) state.inventory.copper -= r.req.copper;
      
      if(id === 'axe') { state.upgrades.axe = true; document.getElementById('slot-axe').classList.remove('locked'); addTextParticle('[돌도끼 획득!]', state.player.x, state.player.y - 30, '#f1c40f'); }
      if(id === 'bow') { state.upgrades.bow = true; document.getElementById('slot-bow').classList.remove('locked'); addTextParticle('[활 획득!]', state.player.x, state.player.y - 30, '#f1c40f'); }
      if(id === 'pickaxe') { state.upgrades.pickaxe = true; document.getElementById('slot-pickaxe').classList.remove('locked'); addTextParticle('[곡괭이 획득!]', state.player.x, state.player.y - 30, '#f1c40f'); }
      if(id === 'sword') { state.upgrades.sword = true; document.getElementById('slot-sword').classList.remove('locked'); addTextParticle('[청동검 획득!]', state.player.x, state.player.y - 30, '#f1c40f'); }
      if(id === 'armor') { state.upgrades.armor = true; recalculateStats(); addTextParticle('[최대 체력 대폭 증가!]', state.player.x, state.player.y - 30, '#2ecc71'); }
      renderCraftList();
      saveGame(false);
    };

    // --- 8. 조작계 및 입력 이벤트 ---
    window.setWeapon = function(w) {
      if (w !== 'barehand' && !state.upgrades[w]) { addTextParticle('[제작 필요]', state.player.x, state.player.y - 20, '#e74c3c'); return; }
      state.player.weapon = w;
      document.querySelectorAll('.slot').forEach(el => el.classList.remove('active'));
      document.getElementById('slot-' + w).classList.add('active');
      if(!state.buildMode) document.getElementById('btn-attack').innerText = (w === 'bow') ? '발사' : '공격';
    }

    function checkCollision(nx, ny, isEnemy = false) {
      if (isNaN(nx) || isNaN(ny)) return true;
      if(nx < 20 || ny < 20 || nx > WORLD_SIZE - 20 || ny > WORLD_SIZE - 20) return true;
      for (let s of state.structures) {
        if (s && s.part && (s.part.collide === true || (s.part.collide === 'enemyOnly' && isEnemy))) {
          if (s.part.id !== 'fire' && Math.hypot(nx - s.x, ny - s.y) < 12) return true;
        }
      }
      return false;
    }

    function explodeLetters(letters, x, y, itemType) {
      if (!letters || !Array.isArray(letters)) return;
      letters.forEach(char => {
        const angle = Math.random() * Math.PI * 2; const speed = 2.5 + Math.random() * 3.5;
        state.letterPickups.push({ char, itemType, x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed, life: 1800, delayPickup: 20 });
      });
    }

    function performInteract() {
      const p = state.player; let nearWorkbench = false;
      for(let s of state.structures) { if(s.part?.id === 'workbench' && Math.hypot(p.x - s.x, p.y - s.y) < 150) { openCrafting(); nearWorkbench = true; break; } }
      if(nearWorkbench) return;

      if (Math.hypot(p.x - state.altar.x, p.y - state.altar.y) < 150 && !state.altar.activated) {
        if (state.inventory.trophy >= 3) {
          state.altar.activated = true; flashScreen(); document.getElementById('boss-hud').style.display = 'flex';
          addTextParticle('[⚡ 에이크쉬르 강림! ⚡]', state.altar.x, state.altar.y - 40, '#00d2d3');
          state.boss = { name: '[ 거 대 한 사 슴 왕 ]', x: state.altar.x, y: state.altar.y - 150, hp: 800, maxHp: 800, state: 'idle', timer: 0, shake: 0, targetX: 0, targetY: 0 };
        } else addTextParticle('[사슴 트로피 3개 필요!]', state.altar.x, state.altar.y - 20, '#ff4757');
      }
    }

    const initAudio = () => sfx.init();
    const touchAreaLeft = document.getElementById('touch-area-left'); const joyBase = document.getElementById('joystick-base'); const joyStick = document.getElementById('joystick-stick');
    touchAreaLeft.addEventListener('touchstart', e => { e.preventDefault(); initAudio(); if (state.joystick.active) return; const touch = e.changedTouches[0]; state.joystick.active = true; state.joystick.id = touch.identifier; state.joystick.startX = touch.clientX; state.joystick.startY = touch.clientY; joyBase.style.left = touch.clientX + 'px'; joyBase.style.top = touch.clientY + 'px'; joyBase.style.display = 'block'; joyStick.style.transform = `translate(0px, 0px)`; });
    touchAreaLeft.addEventListener('touchmove', e => { e.preventDefault(); if (!state.joystick.active) return; for (let i = 0; i < e.changedTouches.length; i++) { if (e.changedTouches[i].identifier === state.joystick.id) { handleJoyMove(e.changedTouches[i].clientX, e.changedTouches[i].clientY); break; } } });
    const resetJoy = e => { if (!state.joystick.active) return; for (let i = 0; i < e.changedTouches.length; i++) { if (e.changedTouches[i].identifier === state.joystick.id) { state.joystick.active = false; state.joystick.dx = 0; state.joystick.dy = 0; joyBase.style.display = 'none'; joyStick.style.transform = `translate(0px, 0px)`; break; } } };
    touchAreaLeft.addEventListener('touchend', resetJoy); touchAreaLeft.addEventListener('touchcancel', resetJoy);
    
    function handleJoyMove(cx, cy) { const maxDist = 38; let dx = cx - state.joystick.startX; let dy = cy - state.joystick.startY; const dist = Math.hypot(dx, dy); if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; } joyStick.style.transform = `translate(${dx}px, ${dy}px)`; state.joystick.dx = dx / maxDist; state.joystick.dy = dy / maxDist; }

    const btnAttack = document.getElementById('btn-attack');
    btnAttack.addEventListener('touchstart', e => { e.preventDefault(); initAudio(); if (state.gameOver || state.isUIOpen) return; if (state.buildMode) placeStructure(); else executeAttack(); });
    btnAttack.addEventListener('touchend', e => { e.preventDefault(); if (!state.buildMode && state.player.weapon === 'bow' && state.player.isCharging) fireBow(); });
    document.getElementById('btn-parry').addEventListener('touchstart', e => { e.preventDefault(); initAudio(); if (!state.gameOver && !state.buildMode && !state.isUIOpen && (state.player.weapon !== 'bow')) { state.player.isGuarding = true; state.player.parryWindow = 14; } });
    document.getElementById('btn-parry').addEventListener('touchend', e => { e.preventDefault(); state.player.isGuarding = false; });
    document.getElementById('btn-interact').addEventListener('touchstart', e => { e.preventDefault(); initAudio(); if(!state.isUIOpen) performInteract(); });
    document.getElementById('btn-inv').addEventListener('touchstart', e => { e.preventDefault(); initAudio(); if(state.isUIOpen) closeInventory(); else openInventory(); });
    document.getElementById('btn-build').addEventListener('touchstart', e => { e.preventDefault(); initAudio(); if(!state.isUIOpen) toggleBuildMode(); });
    document.getElementById('btn-part').addEventListener('touchstart', e => { e.preventDefault(); initAudio(); if(!state.isUIOpen) cycleBuildPart(); });

    window.addEventListener('keydown', e => {
      initAudio();
      if (state.gameOver) return;
      if (e.key === 'Escape') { closeCrafting(); closeInventory(); return; }
      if (e.key === 'i' || e.key === 'I') { if (state.isUIOpen) closeInventory(); else openInventory(); return; }
      if (state.isUIOpen) return;
      const key = e.key.toLowerCase(); state.keys[key] = true;
      if (key === '1') setWeapon('barehand'); if (key === '2') setWeapon('axe'); if (key === '3') setWeapon('bow');
      if (key === '4') setWeapon('pickaxe'); if (key === '5') setWeapon('sword');
      if (key === 'e') performInteract(); if (key === 'b') toggleBuildMode(); if (key === 'r') cycleBuildPart();
    });
    window.addEventListener('keyup', e => state.keys[e.key.toLowerCase()] = false);
    window.addEventListener('mousemove', e => { if(state.isUIOpen) return; state.mouse.x = e.clientX; state.mouse.y = e.clientY; const camX = state.player.x - canvas.width / 2; const camY = state.player.y - canvas.height / 2; state.mouse.worldX = e.clientX + camX; state.mouse.worldY = e.clientY + camY; if (!state.joystick.active) state.player.facingAngle = Math.atan2(e.clientY + camY - state.player.y, e.clientX + camX - state.player.x); });
    window.addEventListener('mousedown', e => { initAudio(); if (state.gameOver || state.isUIOpen) return; if (e.button === 0) { if (state.buildMode) placeStructure(); else executeAttack(); } if (e.button === 2 && !state.buildMode && state.player.weapon !== 'bow') { state.player.isGuarding = true; state.player.parryWindow = 14; } });
    window.addEventListener('mouseup', e => { if (e.button === 0 && !state.buildMode && state.player.weapon === 'bow' && state.player.isCharging) fireBow(); if (e.button === 2) state.player.isGuarding = false; });
    window.addEventListener('contextmenu', e => e.preventDefault());

    function executeAttack() {
      if (state.player.weapon === 'barehand') performBarehandAttack();
      else if (state.player.weapon === 'sword') performSwordAttack();
      else if (state.player.weapon === 'axe') performAxeAttack();
      else if (state.player.weapon === 'pickaxe') performPickaxeAttack();
      else if (state.player.weapon === 'bow' && state.player.sta >= 8) { state.player.isCharging = true; state.player.chargeTimer = 0; }
    }

    function toggleBuildMode() {
      state.buildMode = !state.buildMode; const statusText = document.getElementById('build-status-text'); const btnPart = document.getElementById('btn-part');
      if (state.buildMode) { state.player.isCharging = false; state.player.isGuarding = false; btnAttack.innerText = '건설'; btnAttack.style.background = 'rgba(142, 68, 173, 0.8)'; btnAttack.style.borderColor = '#8e44ad'; btnPart.style.display = 'flex'; statusText.innerText = `건축 모드: ${buildParts[state.buildIdx].text} (R키 변경)`; } 
      else { btnAttack.style.background = 'rgba(231, 76, 60, 0.8)'; btnAttack.style.borderColor = '#e74c3c'; btnPart.style.display = 'none'; btnAttack.innerText = state.player.weapon === 'bow' ? '발사' : '공격'; statusText.innerText = `건축(B): 꺼짐 | 가방(I) | 상호작용(E)`; }
    }
    function cycleBuildPart() { if (!state.buildMode) return; state.buildIdx = (state.buildIdx + 1) % buildParts.length; document.getElementById('build-status-text').innerText = `건축 모드: ${buildParts[state.buildIdx].text} (R키 변경)`; }
    function getSnapTarget() { let targetX, targetY; if (state.mouse.worldX && !state.joystick.active) { targetX = state.mouse.worldX; targetY = state.mouse.worldY; } else { targetX = state.player.x + Math.cos(state.player.facingAngle) * 60; targetY = state.player.y + Math.sin(state.player.facingAngle) * 60; } return { x: Math.round(targetX / 50) * 50, y: Math.round(targetY / 50) * 50 }; }
    function placeStructure() {
      const part = buildParts[state.buildIdx]; const snap = getSnapTarget();
      if (state.structures.find(s => s.x === snap.x && s.y === snap.y)) { addTextParticle('[이미 건물이 있습니다!]', snap.x, snap.y, '#e74c3c'); return; }
      if (part.collide === true && Math.hypot(state.player.x - snap.x, state.player.y - snap.y) < 20) { addTextParticle('[너무 가깝습니다!]', snap.x, snap.y, '#e74c3c'); return; }
      if (state.inventory.wood >= part.cost) { sfx.chopWood(); state.inventory.wood -= part.cost; state.structures.push({ part, x: snap.x, y: snap.y, hp: 20, maxHp: 20, shake: 0 }); addTextParticle('[설치 완료!]', snap.x, snap.y - 15, '#2ecc71'); } 
      else addTextParticle(`[목재 ${part.cost}개 필요!]`, snap.x, snap.y - 15, '#e74c3c');
    }
    function flashScreen() { const fl = document.getElementById('flash-overlay'); fl.style.opacity = '0.85'; setTimeout(() => fl.style.opacity = '0', 70); }

    // 공격 로직
    function performBarehandAttack() {
      const p = state.player; if (p.sta < 8) return; p.sta -= 8; state.punchAnim = 10; const angle = p.facingAngle; sfx.swing();
      state.resources.forEach(r => { if (r.type === 'wood' && hitCheck(p, r, angle, 45, Math.PI / 3)) { r.hp -= 1.0; sfx.chopWood(); addTextParticle('[툭!]', r.x, r.y - 10, '#f1c40f'); if (r.hp <= 0) explodeLetters(r.letters, r.x, r.y, r.type); } });
      state.resources = state.resources.filter(r => r.hp > 0);
      state.enemies.forEach(en => { if (hitCheck(p, en, angle, 45, Math.PI / 3)) { en.hp -= 6; en.shake = 8; sfx.hitEnemy(); addTextParticle('[-6]', en.x, en.y - 15, '#e67e22'); } });
    }
    function performSwordAttack() {
      const p = state.player; if (p.sta < 10) return; p.sta -= 10; state.swingAnim = 10; const angle = p.facingAngle; const dmg = state.upgrades.sword ? 35 : 15; sfx.swing();
      state.enemies.forEach(en => { if (hitCheck(p, en, angle, 75, Math.PI / 4)) { en.hp -= dmg; en.shake = 8; sfx.hitEnemy(); if(!checkCollision(en.x + Math.cos(angle)*15, en.y, true)) en.x += Math.cos(angle) * 15; if(!checkCollision(en.x, en.y + Math.sin(angle)*15, true)) en.y += Math.sin(angle) * 15; addTextParticle(`[-${dmg}]`, en.x, en.y - 15, '#ff4757'); } });
      state.resources.forEach(r => { if (r.type === 'chest' && hitCheck(p, r, angle, 60, Math.PI / 3)) { r.hp -= 1; sfx.chopWood(); addTextParticle('[퍽!]', r.x, r.y - 10, '#f1c40f'); if (r.hp <= 0) explodeLetters(r.letters, r.x, r.y, r.type); } });
      state.resources = state.resources.filter(r => r.hp > 0);
      state.structures.forEach(s => { if (Math.hypot(s.x - p.x, s.y - p.y) < 55) { s.hp -= 5; s.shake = 8; sfx.chopWood(); addTextParticle('[-5]', s.x, s.y - 10, '#a4b0be'); if(s.hp <= 0) { explodeLetters(['ㅁ','ㅗ','ㄱ','ㅈ','ㅐ'], s.x, s.y, 'wood'); addTextParticle('[파괴됨]', s.x, s.y, '#e74c3c'); } } });
      state.structures = state.structures.filter(s => s.hp > 0);
      if (state.boss && hitCheck(p, state.boss, angle, 90, Math.PI / 4)) { const b = state.boss; const bdmg = b.state === 'stun' ? dmg*2 : dmg; b.hp -= bdmg; b.shake = 10; sfx.hitEnemy(); addTextParticle(b.state === 'stun' ? `[💥기절 치명타! -${bdmg}]` : `[-${bdmg}]`, b.x, b.y - 25, '#ff4757'); }
    }
    function performAxeAttack() {
      const p = state.player; if (p.sta < 10) return; p.sta -= 10; state.axeAnim = 10; const angle = p.facingAngle; const axeDmg = state.upgrades.axe ? 3 : 1; sfx.swing();
      state.resources.forEach(r => { if (r.type === 'wood' && hitCheck(p, r, angle, 60, Math.PI / 3)) { r.hp -= axeDmg; sfx.chopWood(); addTextParticle('[채벌!]', r.x, r.y - 10, '#f1c40f'); if (r.hp <= 0) explodeLetters(r.letters, r.x, r.y, r.type); } });
      state.resources = state.resources.filter(r => r.hp > 0);
      state.enemies.forEach(en => { if (hitCheck(p, en, angle, 55, Math.PI / 3)) { en.hp -= 10; en.shake = 8; sfx.hitEnemy(); addTextParticle('[-10]', en.x, en.y - 15, '#e67e22'); } });
    }
    function performPickaxeAttack() {
      const p = state.player; if (p.sta < 12) return; p.sta -= 12; state.pickAnim = 10; const angle = p.facingAngle; sfx.swing();
      state.resources.forEach(r => { if ((r.type === 'stone' || r.type === 'copper') && hitCheck(p, r, angle, 65, Math.PI / 4)) { r.hp -= 2; sfx.mineRock(); addTextParticle('[깡!]', r.x, r.y - 10, '#3498db'); if (r.hp <= 0) explodeLetters(r.letters, r.x, r.y, r.type); } });
      state.resources = state.resources.filter(r => r.hp > 0);
      state.enemies.forEach(en => { if (hitCheck(p, en, angle, 55, Math.PI / 4)) { en.hp -= 8; en.shake = 8; sfx.hitEnemy(); addTextParticle('[-8]', en.x, en.y - 15, '#e67e22'); } });
    }
    function hitCheck(p, target, angle, maxDist, maxAngleDiff) {
      const dist = Math.hypot(target.x - p.x, target.y - p.y); let diff = Math.abs(angle - Math.atan2(target.y - p.y, target.x - p.x));
      if (diff > Math.PI) diff = 2 * Math.PI - diff; return dist < maxDist && diff < maxAngleDiff;
    }
    function fireBow() {
      const p = state.player; const ratio = Math.min(1, p.chargeTimer / p.maxCharge); if (ratio < 0.2) { p.isCharging = false; return; }
      p.sta = Math.max(0, p.sta - 12); const spread = (1 - ratio) * (Math.PI / 8); const fireAngle = p.facingAngle + (Math.random() - 0.5) * 2 * spread;
      const isCrit = ratio >= 0.95; state.arrows.push({ x: p.x, y: p.y, vx: Math.cos(fireAngle) * (18+ratio*18), vy: Math.sin(fireAngle) * (18+ratio*18), angle: fireAngle, dmg: isCrit ? 40 : Math.floor(12 + ratio * 18), isCrit, life: 50 });
      p.isCharging = false; p.chargeTimer = 0; sfx.swing();
    }
    function addTextParticle(text, x, y, color) { state.particles.push({ text, x, y, life: 35, color }); }

    // --- 9. 게임 루프 & 렌더링 ---
    let lastTime = 0;
    function update(currentTime) {
      requestAnimationFrame(update);
      try {
        if (!currentTime) return;
        if (lastTime === 0) { lastTime = currentTime; return; }
        const dt = currentTime - lastTime;
        if (dt < 16.0) return;
        lastTime = currentTime;

        if (state.gameOver || state.isUIOpen) { draw(state.player.x - canvas.width / 2, state.player.y - canvas.height / 2); return; }
        
        const p = state.player; 
        state.gameSeconds += 1/60; let cycle = state.gameSeconds % 600; state.isNight = cycle >= 300; 
        let calculatedDay = Math.floor(state.gameSeconds / 600) + 1;
        if (calculatedDay !== state.currentDay) { state.currentDay = calculatedDay; state.raidTriggered = false; }

        let timeText = state.isNight ? '🌙 밤' : '☀️ 낮'; 
        let hour = Math.floor((cycle / 600) * 24 + 8) % 24; let min = Math.floor(((cycle / 600) * 24 * 60) % 60);
        document.getElementById('time-text').innerText = `${timeText} ${String(hour).padStart(2,'0')}:${String(min).padStart(2,'0')}`;
        document.getElementById('day-text').innerText = `Day ${state.currentDay}`;

        // 음식 지속시간 차감 및 재생 효과
        for (let i = state.activeFoods.length - 1; i >= 0; i--) {
          const f = state.activeFoods[i];
          f.duration -= 1/60;
          p.hp = Math.min(p.maxHp, p.hp + f.hpRegen / 60);
          if (f.duration <= 0) {
            state.activeFoods.splice(i, 1);
            recalculateStats();
          }
        }

        // 음식 HUD 업데이트
        for (let slotIdx = 0; slotIdx < 3; slotIdx++) {
          const slotEl = document.getElementById(`food-${slotIdx+1}`);
          const timeEl = document.getElementById(`food-${slotIdx+1}-time`);
          const food = state.activeFoods[slotIdx];
          if (food) {
            slotEl.classList.add('active');
            slotEl.querySelector('span:first-child').innerText = `${food.icon} ${food.name}`;
            timeEl.innerText = `${Math.floor(food.duration)}s`;
          } else {
            slotEl.classList.remove('active');
            slotEl.querySelector('span:first-child').innerText = `슬롯 ${slotIdx+1}`;
            timeEl.innerText = '--';
          }
        }

        // 이동 처리
        let moveX = 0, moveY = 0;
        if (state.joystick.active) { moveX = state.joystick.dx || 0; moveY = state.joystick.dy || 0; const moveLen = Math.hypot(moveX, moveY); if (moveLen > 1) { moveX /= moveLen; moveY /= moveLen; } } 
        else {
          if (state.keys['w']) moveY -= 1; if (state.keys['s']) moveY += 1; if (state.keys['a']) moveX -= 1; if (state.keys['d']) moveX += 1;
          const moveLen = Math.hypot(moveX, moveY); if (moveLen > 0) { moveX /= moveLen; moveY /= moveLen; }
        }

        if (moveX !== 0 || moveY !== 0) {
          let curSpeed = p.speed;
          if (state.keys['shift'] && p.sta > 0) { curSpeed *= 1.6; p.sta = Math.max(0, p.sta - 0.2); }
          if (p.isCharging) curSpeed *= 0.4;
          let nextX = p.x + moveX * curSpeed; let nextY = p.y + moveY * curSpeed;
          if (!checkCollision(nextX, p.y, false)) p.x = nextX;
          if (!checkCollision(p.x, nextY, false)) p.y = nextY;
          if (!state.joystick.active) p.facingAngle = Math.atan2(moveY, moveX);
          if (state.joystick.active) p.facingAngle = Math.atan2(state.joystick.dy, state.joystick.dx);
        } else { if (!p.isCharging && !state.buildMode) p.sta = Math.min(p.maxSta, p.sta + (p.isNearFire ? 0.8 : 0.4)); }

        if (p.isNearFire) p.hp = Math.min(p.maxHp, p.hp + 0.08);
        if (p.isCharging) { p.chargeTimer++; p.sta = Math.max(0, p.sta - 0.08); if (p.sta <= 0) fireBow(); }
        if (p.parryWindow > 0) p.parryWindow--;

        // 채집물 획득
        for (let i = state.consumables.length - 1; i >= 0; i--) {
          const item = state.consumables[i];
          if (Math.hypot(p.x - item.x, p.y - item.y) < 35) {
            if (item.type === 'small_stone') { state.inventory.stone++; addTextParticle('[잔돌 +1]', p.x, p.y - 25, '#a4b0be'); sfx.mineRock(); } 
            else if (item.type === 'mushroom') { state.inventory.mushroom++; addTextParticle('[노란버섯 +1]', p.x, p.y - 25, '#f1c40f'); sfx.eat(); }
            else if (item.type === 'berry') { state.inventory.berry++; addTextParticle('[산딸기 +1]', p.x, p.y - 25, '#ff6b81'); sfx.eat(); }
            state.consumables.splice(i, 1);
          }
        }

        // ★ 모션 기반 몬스터 AI (단순 비비기 공격 삭제)
        state.enemies.forEach(en => {
          if (en.hp <= 0) return; 
          let distToPlayer = Math.hypot(p.x - en.x, p.y - en.y);
          let isAggro = state.isNight || state.isRaid || en.windupTimer > 0;
          if (en.attackCooldown > 0) en.attackCooldown--;

          // 사거리 안에 들어오면 공격 준비 (선딜레이 모션)
          if (distToPlayer < 45 && en.attackCooldown <= 0 && en.windupTimer <= 0) {
            en.windupTimer = 30; // 0.5초간 공격 자세 취함
            sfx.enemyWindup();
          }

          if (en.windupTimer > 0) {
            en.windupTimer--;
            en.vx = 0; en.vy = 0; // 차징 중에는 멈춤
            if (en.windupTimer === 0) { // 차징 완료 후 실제 타격 발동
              if (distToPlayer < 50) {
                let dmg = en.type === 'goblin' ? 18 : 12;
                if (p.isGuarding && p.parryWindow > 0) { 
                  sfx.parry(); addTextParticle('[!! 챙! 패링 !!]', p.x, p.y - 20, '#f1c40f'); 
                  en.shake = 18; en.attackCooldown = 90; // 기절
                } else { 
                  p.hp -= dmg; sfx.hitEnemy(); addTextParticle(`[-${dmg} 타격!]`, p.x, p.y - 15, '#ff4757'); 
                  en.attackCooldown = 60; 
                }
              }
            }
          } else if (isAggro && distToPlayer < 600 && !state.buildMode) { 
            let angle = Math.atan2(p.y - en.y, p.x - en.x); let spd = en.type === 'goblin' ? 1.4 : 1.0; 
            en.vx = Math.cos(angle) * spd; en.vy = Math.sin(angle) * spd;
          } else { 
            en.roamTimer--;
            if (en.roamTimer <= 0) { en.roamTimer = 60 + Math.random() * 90; const a = Math.random() * Math.PI * 2; en.vx = Math.cos(a) * 0.4; en.vy = Math.sin(a) * 0.4; }
          }

          if (!checkCollision(en.x + en.vx, en.y, true)) en.x += en.vx;
          if (!checkCollision(en.x, en.y + en.vy, true)) en.y += en.vy;
        });

        // 파편 획득
        for (let i = state.letterPickups.length - 1; i >= 0; i--) {
          const lp = state.letterPickups[i]; if(!lp) continue;
          lp.x += lp.vx; lp.y += lp.vy; lp.vx *= 0.88; lp.vy *= 0.88;
          if (lp.delayPickup > 0) lp.delayPickup--;
          const dist = Math.hypot(p.x - lp.x, p.y - lp.y);
          if (lp.delayPickup <= 0 && dist < 150) {
            const pullAngle = Math.atan2(p.y - lp.y, p.x - lp.x); lp.x += Math.cos(pullAngle) * 8.5; lp.y += Math.sin(pullAngle) * 8.5;
            if (dist < 35) {
              if (lp.itemType === 'wood') { state.inventory.wood++; addTextParticle(`[${lp.char}]`, p.x, p.y - 25, '#2ed573'); sfx.chopWood(); }
              else if (lp.itemType === 'stone') { state.inventory.stone++; addTextParticle(`[${lp.char}]`, p.x, p.y - 25, '#a4b0be'); sfx.mineRock(); }
              else if (lp.itemType === 'copper') { state.inventory.copper++; addTextParticle(`[${lp.char}]`, p.x, p.y - 25, '#e67e22'); sfx.mineRock(); }
              else if (lp.itemType === 'chest') { state.inventory.coin++; addTextParticle(`[${lp.char}]`, p.x, p.y - 25, '#f1c40f'); }
              else if (lp.itemType === 'meat') { state.inventory.meat++; addTextParticle('[고기 +1]', p.x, p.y - 25, '#ff4757'); }
              state.letterPickups.splice(i, 1); continue;
            }
          }
          lp.life--; if (lp.life <= 0) state.letterPickups.splice(i, 1);
        }

        for (let i = state.arrows.length - 1; i >= 0; i--) {
          const arr = state.arrows[i]; arr.x += arr.vx; arr.y += arr.vy; arr.life--; let hit = false;
          state.enemies.forEach(en => { if (en.hp > 0 && Math.hypot(en.x - arr.x, en.y - arr.y) < 30) { en.hp -= arr.dmg; en.shake = 8; sfx.hitEnemy(); addTextParticle(`[-${arr.dmg}]`, en.x, en.y - 15, '#ffa502'); hit = true; } });
          if (hit || arr.life <= 0) state.arrows.splice(i, 1);
        }

        state.enemies.forEach(en => { 
          if (en.hp <= 0 && en.drop) { 
            if (en.drop === 'meat') { state.inventory.meat += 2; addTextParticle('[고기 2개 획득!]', en.x, en.y - 30, '#ff4757'); }
            if (en.drop === 'mushroom') { state.inventory.mushroom += 2; addTextParticle('[버섯 2개 획득!]', en.x, en.y - 30, '#f1c40f'); }
            if (Math.random() > 0.6) state.inventory.trophy++;
            explodeLetters(en.letters || [], en.x, en.y, en.drop); en.drop = null; 
          } 
        });

        if (p.hp <= 0) { state.gameOver = true; document.getElementById('gameover-screen').style.display = 'block'; }
        document.getElementById('hp-bar').style.width = `${Math.max(0, (p.hp / p.maxHp) * 100)}%`; 
        document.getElementById('hp-text').innerText = `${Math.floor(p.hp)} / ${p.maxHp}`;
        document.getElementById('sta-bar').style.width = `${(p.sta / p.maxSta) * 100}%`;
        document.getElementById('sta-text').innerText = `${Math.floor(p.sta)} / ${p.maxSta}`;
        
        draw(p.x - canvas.width / 2, p.y - canvas.height / 2); 
      } catch (err) { console.error("Game Loop Guarded:", err); }
    }

    function isVisible(x, y, camX, camY, padding = 150) { return x > camX - padding && x < camX + canvas.width + padding && y > camY - padding && y < camY + canvas.height + padding; }

    function draw(camX, camY) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const cR1 = 46 + (19 - 46) * state.biomeLerp; const cG1 = 93 + (31 - 93) * state.biomeLerp; const cB1 = 50 + (36 - 50) * state.biomeLerp;
      const cR2 = 27 + (8 - 27) * state.biomeLerp; const cG2 = 59 + (13 - 59) * state.biomeLerp; const cB2 = 31 + (16 - 31) * state.biomeLerp;
      const grad = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 100, canvas.width/2, canvas.height/2, canvas.width);
      grad.addColorStop(0, `rgb(${cR1},${cG1},${cB1})`); grad.addColorStop(1, `rgb(${cR2},${cG2},${cB2})`);
      ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.save(); ctx.translate(-camX, -camY);

      state.decorations.forEach(d => { if(isVisible(d.x, d.y, camX, camY, 50)) { ctx.fillStyle = d.color; ctx.font = '14px sans-serif'; ctx.fillText(d.text, d.x, d.y); } });
      ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center';
      state.pois.forEach(poi => { if (isVisible(poi.x, poi.y, camX, camY)) { ctx.fillStyle = '#555'; ctx.font = 'bold 24px sans-serif'; ctx.fillText(poi.text, poi.x, poi.y); } });
      state.structures.forEach(s => { if (s.part?.id === 'floor' && isVisible(s.x, s.y, camX, camY)) { ctx.fillStyle = s.part.color; ctx.fillText(s.part.text, s.x, s.y); } });
      if(isVisible(state.altar.x, state.altar.y, camX, camY)) { ctx.fillStyle = state.altar.activated ? '#00d2d3' : '#f1c40f'; ctx.fillText(state.altar.activated ? '[⚡ 제단 ⚡]' : '[🏛️ 소환 제단]', state.altar.x, state.altar.y); }
      
      state.consumables.forEach(c => { if(isVisible(c.x, c.y, camX, camY)) { ctx.fillStyle = c.type === 'mushroom' ? '#ff4757' : (c.type === 'berry' ? '#ff6b81' : '#a4b0be'); ctx.font = 'bold 13px sans-serif'; ctx.fillText(c.text, c.x, c.y); } });
      state.resources.forEach(r => { if(isVisible(r.x, r.y, camX, camY)) { ctx.fillStyle = r.type === 'wood' ? '#2ed573' : (r.type === 'copper' ? '#e67e22' : '#ced6e0'); if(r.text.includes('검은')) ctx.fillStyle = '#7f8fa6'; if(r.type === 'chest') ctx.fillStyle='#f39c12'; ctx.font = `bold ${r.fontSize || '16px'} sans-serif`; ctx.fillText(r.text, r.x, r.y); } });
      state.letterPickups.forEach(lp => { if(isVisible(lp.x, lp.y, camX, camY)) { ctx.fillStyle = lp.itemType === 'wood' ? '#2ed573' : (lp.itemType === 'stone' ? '#ced6e0' : (lp.itemType==='copper' ? '#e67e22' : '#ff6b81')); if(lp.itemType==='chest') ctx.fillStyle='#f1c40f'; ctx.font = 'bold 15px monospace'; ctx.fillText(lp.char, lp.x, lp.y); } });
      state.structures.forEach(s => { if (s.part?.id !== 'floor' && isVisible(s.x, s.y, camX, camY)) { ctx.fillStyle = s.part.color; let ox = s.shake > 0 ? (Math.random()-0.5)*4 : 0; if(s.shake>0) s.shake--; ctx.font = 'bold 15px sans-serif'; ctx.fillText(s.part.text, s.x + ox, s.y); } });
      
      // 몬스터 렌더링 (차징 시 붉은색 경고 표시)
      state.enemies.forEach(en => { 
        if (en.hp > 0 && isVisible(en.x, en.y, camX, camY)) { 
           ctx.fillStyle = en.windupTimer > 0 ? '#ff0000' : (state.isNight ? '#e74c3c' : (en.type === 'goblin' ? '#27ae60' : '#ff7675')); 
           ctx.font = en.windupTimer > 0 ? 'bold 16px sans-serif' : 'bold 14px sans-serif'; 
           let ox = en.shake > 0 ? (Math.random() - 0.5) * 6 : 0; 
           let tag = en.windupTimer > 0 ? `[⚠️ ${en.type==='goblin'?'고블린':'멧돼지'} (공격준비!)]` : `${en.text} [${en.hp}]`;
           ctx.fillText(tag, en.x + ox, en.y); 
        } 
      });

      if (state.boss && state.boss.hp > 0 && isVisible(state.boss.x, state.boss.y, camX, camY, 200)) { const b = state.boss; ctx.fillStyle = b.state === 'stun' ? '#f1c40f' : '#ff4757'; ctx.font = 'bold 24px sans-serif'; let ox = b.shake > 0 ? (Math.random() - 0.5) * 8 : 0; ctx.fillText(b.state === 'stun' ? '[💫기절!💫]' : b.name, b.x + ox, b.y); }
      ctx.fillStyle = '#ffffff'; ctx.font = '12px sans-serif'; state.arrows.forEach(arr => { if(isVisible(arr.x, arr.y, camX, camY)) { ctx.save(); ctx.translate(arr.x, arr.y); ctx.rotate(arr.angle); ctx.fillText(arr.isCrit ? '──▶▶' : '──▶', 0, 4); ctx.restore(); } });

      const p = state.player;
      if (state.punchAnim > 0) { state.punchAnim--; ctx.beginPath(); const ext = 15 - Math.abs(state.punchAnim - 5) * 3; ctx.arc(p.x + Math.cos(p.facingAngle)*ext, p.y + Math.sin(p.facingAngle)*ext, 6, 0, Math.PI*2); ctx.fillStyle = '#f1c40f'; ctx.fill(); }
      if (state.swingAnim > 0) { state.swingAnim--; ctx.beginPath(); ctx.arc(p.x, p.y, 65, p.facingAngle - Math.PI/5, p.facingAngle + Math.PI/5); ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)'; ctx.lineWidth = 3; ctx.stroke(); }
      if (state.axeAnim > 0) { state.axeAnim--; ctx.beginPath(); ctx.arc(p.x, p.y, 55, p.facingAngle - Math.PI/3, p.facingAngle + Math.PI/3); ctx.strokeStyle = '#f39c12'; ctx.lineWidth = 4; ctx.stroke(); }
      if (state.pickAnim > 0) { state.pickAnim--; ctx.beginPath(); ctx.arc(p.x, p.y, 60, p.facingAngle - Math.PI/4, p.facingAngle + Math.PI/4); ctx.strokeStyle = '#3498db'; ctx.lineWidth = 4; ctx.stroke(); }

      ctx.fillStyle = '#70a1ff'; ctx.font = 'bold 12px sans-serif';
      let pTag = '[나]'; if (p.isGuarding) pTag = p.parryWindow > 0 ? '[나 (패링!)]' : '[나 (방어)]'; if (p.isCharging) pTag = (Math.min(1, p.chargeTimer / p.maxCharge)) >= 0.95 ? '[나 (완충!)]' : '[나 (조준)]'; if (p.isNearFire) pTag += ' (따뜻함♨)';
      ctx.fillText(pTag, p.x, p.y);

      if (state.buildMode) {
        const snap = getSnapTarget(); const part = buildParts[state.buildIdx];
        const canBuild = state.inventory.wood >= part.cost && !state.structures.some(s => s.x === snap.x && s.y === snap.y);
        ctx.fillStyle = canBuild ? 'rgba(46, 204, 113, 0.7)' : 'rgba(231, 76, 60, 0.7)'; ctx.font = 'bold 15px sans-serif'; ctx.fillText(part.text, snap.x, snap.y);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)'; ctx.strokeRect(snap.x - 25, snap.y - 25, 50, 50);
      }

      for (let i = state.particles.length - 1; i >= 0; i--) { const pt = state.particles[i]; ctx.fillStyle = pt.color; ctx.font = '12px sans-serif'; ctx.fillText(pt.text, pt.x, pt.y); pt.y -= 0.6; pt.life--; if (pt.life <= 0) state.particles.splice(i, 1); }
      ctx.restore(); renderNightLighting(camX, camY);
    }

    function renderNightLighting(camX, camY) {
      if (!state.isNight && !state.isRaid) return;
      let darkness = state.isRaid ? 0.95 : 0.85; 

      lightCtx.clearRect(0, 0, lightCanvas.width, lightCanvas.height); lightCtx.fillStyle = `rgba(15, 5, 5, ${darkness})`; lightCtx.fillRect(0, 0, lightCanvas.width, lightCanvas.height);
      lightCtx.globalCompositeOperation = 'destination-out'; const flicker = Math.sin(Date.now() * 0.008) * 4;

      const pScreenX = state.player.x - camX; const pScreenY = state.player.y - camY;
      const pGrad = lightCtx.createRadialGradient(pScreenX, pScreenY, 20, pScreenX, pScreenY, 170 + flicker);
      pGrad.addColorStop(0, 'rgba(0,0,0,1)'); pGrad.addColorStop(1, 'rgba(0,0,0,0)');
      lightCtx.fillStyle = pGrad; lightCtx.beginPath(); lightCtx.arc(pScreenX, pScreenY, 170 + flicker, 0, Math.PI * 2); lightCtx.fill();

      state.structures.forEach(s => {
        if (s.part?.id !== 'fire' || !isVisible(s.x, s.y, camX, camY, 300)) return;
        const cx = s.x - camX; const cy = s.y - camY;
        const cGrad = lightCtx.createRadialGradient(cx, cy, 25, cx, cy, 230 + flicker * 1.5);
        cGrad.addColorStop(0, 'rgba(0,0,0,1)'); cGrad.addColorStop(1, 'rgba(0,0,0,0)');
        lightCtx.fillStyle = cGrad; lightCtx.beginPath(); lightCtx.arc(cx, cy, 230 + flicker * 1.5, 0, Math.PI * 2); lightCtx.fill();
      });

      if(isVisible(state.altar.x, state.altar.y, camX, camY, 200)) {
        const ax = state.altar.x - camX; const ay = state.altar.y - camY;
        const aGrad = lightCtx.createRadialGradient(ax, ay, 10, ax, ay, 150);
        aGrad.addColorStop(0, 'rgba(0,0,0,0.9)'); aGrad.addColorStop(1, 'rgba(0,0,0,0)');
        lightCtx.fillStyle = aGrad; lightCtx.beginPath(); lightCtx.arc(ax, ay, 150, 0, Math.PI * 2); lightCtx.fill();
      }
      lightCtx.globalCompositeOperation = 'source-over'; ctx.drawImage(lightCanvas, 0, 0);
    }

    requestAnimationFrame(update);
  </script>
